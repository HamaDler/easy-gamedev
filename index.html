<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%assets/ez-gamedev-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f5" />
    <meta name="description" content="Learn how games work. Build browser games or complete 2D and 3D Godot projects with AI, while understanding every system you create." />
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong colors.
      (function(){var t;try{t=JSON.parse(localStorage.getItem('vibe-coding-games:v1')).theme;}catch(e){}
      if(t!=='dark'&&t!=='light'){try{t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}catch(e){t='light';}}
      document.documentElement.dataset.theme=t;
      if(t==='dark')document.querySelector('meta[name="theme-color"]').setAttribute('content','#242320');})();
    </script>
    <title>ez gamedev — Learn. Make. Understand.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
